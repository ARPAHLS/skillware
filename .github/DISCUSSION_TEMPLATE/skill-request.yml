title: "[Skill Request] "
labels: ["skill request", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ask for a capability that is not in the [Skill library](https://github.com/ARPAHLS/skillware/blob/main/docs/skills/README.md) yet.
        Check [existing issues](https://github.com/ARPAHLS/skillware/issues) and category hubs under `docs/skills/<category>/` first.
  - type: textarea
    id: problem
    attributes:
      label: What problem should the skill solve?
      description: Operator-facing problem, not a feature slogan.
      placeholder: Host agents need a deterministic way to…
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Likely category
      options:
        - office
        - creative
        - finance
        - defi
        - optimization
        - data_engineering
        - compliance
        - security
        - dev_tools
        - monitoring
        - wellness
        - linguistics
        - new category (discuss first)
    validations:
      required: true
  - type: textarea
    id: load_id
    attributes:
      label: Proposed registry ID
      description: Must fit `category/skill_name` if you already have one.
      placeholder: finance/ofac_refresh
  - type: textarea
    id: hosts
    attributes:
      label: Target host agents
      description: Where you want to load the skill (Gemini, Claude, LangChain, Bedrock, Ollama, …).
      placeholder: Claude host loop plus an offline pytest path
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Enabling GitHub Discussions is a repository setting. If this form is not attached to a Discussions category yet, open a **New Skill Proposal** issue instead.
