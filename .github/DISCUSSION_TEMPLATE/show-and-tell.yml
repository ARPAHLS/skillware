title: "[Show and Tell] "
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Share a working Skillware integration, chain, or operator setup. Link the skills you used from the [Skill library](https://github.com/ARPAHLS/skillware/blob/main/docs/skills/README.md).
  - type: input
    id: skills
    attributes:
      label: Skill IDs
      placeholder: security/prompt_injection_firewall, optimization/context_optimizer
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: What did you build?
      description: Host agent, pipeline, and what stayed deterministic vs model-side.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Repo, gist, or gist of the agent loop. No secrets.
