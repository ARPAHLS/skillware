name: defi/token_security_scanner
version: 0.2.0
description: |
  Read-only ERC-20 / LP token security scan on supported EVM chains via GoPlus.
  Returns a stable JSON report (honeypot, taxes, ownership, proxy, mint/blacklist)
  for agent pre-trade checks. Never signs or swaps.
short_description: "Scan EVM token contracts for honeypot/tax/ownership risk via GoPlus."
category: defi
issuer:
  name: Hendobox
  email: henryonyebuchi53@gmail.com
  github: Hendobox
  org: ARPAHLS
parameters:
  type: object
  properties:
    action:
      type: string
      enum:
        - scan
        - scan_batch
        - supported_chains
      description: Skill operation to run.
    chain:
      type: string
      description: |
        Chain slug (e.g. ethereum, base, bsc). Required for scan.
        Call supported_chains for the full list.
    contract:
      type: string
      description: |
        ERC-20 (or LP) contract address (0x…). Required for scan unless token is set.
    token:
      type: string
      description: |
        Operator token slug from evm.tokens (for example degen on base).
        Used when contract is omitted. Must match contract when both are set.
    items:
      type: array
      description: |
        scan_batch targets. Each item is {chain, contract|token}. Maximum 5.
    policy_path:
      type: string
      description: |
        Optional operator policy YAML for this call. When omitted, uses
        TOKEN_SCAN_POLICY_PATH, then ~/.config/skillware/token_scan_policy.yaml,
        then the bundled enterprise_default profile.
  required:
    - action
outputs:
  status:
    type: string
    description: "ok on success; error on validation/API failures."
  chain:
    type: string
    description: "Chain slug used for the scan (scan only)."
  contract:
    type: string
    description: "Normalized contract address (scan only)."
  risk_tier:
    type: string
    description: "critical | high | medium | low | unknown (scan only)."
  policy_action:
    type: string
    description: "allow | flag | block. Hosts gate trades on this field."
  policy_profile:
    type: string
    description: "Operator profile name that produced policy_action."
  report_schema_version:
    type: string
    description: "Report contract version (0.2)."
  report_id:
    type: string
    description: "Stable id for this scan report."
  worst_risk_tier:
    type: string
    description: "Highest risk_tier across a scan_batch."
  signals:
    type: object
    description: "Normalized GoPlus flags (honeypot, taxes, ownership, etc.)."
  token:
    type: object
    description: "Optional token metadata from GoPlus (name, symbol, decimals)."
  sources:
    type: array
    description: "Provider provenance including fetched_at timestamps."
  warnings:
    type: array
    description: "Soft coverage notes (proxy, closed source, API limits)."
  contract_errors:
    type: array
    description: "Deterministic risk factor codes that drove risk_tier."
  error_code:
    type: string
    description: "Present when status is error (e.g. unsupported_chain, rate_limited)."
  message:
    type: string
    description: "Human-readable error message when status is error."
  chains:
    type: array
    description: "Enabled chain slugs with GoPlus chain_id (supported_chains only)."
  fetched_at:
    type: string
    description: "UTC timestamp when the report or chain list was fetched."
constitution: |
  1. READ-ONLY: Never sign transactions, request private keys, or execute swaps.
  2. NOT FINANCIAL ADVICE / NOT A FULL AUDIT: Flags are third-party API signals that
     may lag new exploits, miss unverified proxies, or be unknown for some chains.
  3. FAIL CLOSED ON BAD INPUT: Invalid addresses or unsupported chains return error —
     do not invent risk tiers.
  4. SECRETS: Optional GoPlus credentials stay in env/config only; never log them.
  5. CHAIN BEFORE TRADE: Hosts gate on policy_action. block means do not trade.
     flag means human confirmation. allow still is not financial advice.
     status != ok fails closed. Default profile blocks critical, high, and unknown.
env_vars:
  GOPLUS_APP_KEY:
    description: |
      Optional GoPlus access token / app credential. When set, sent as
      Authorization Bearer. Free permissionless Token Security calls work without it.
    required: false
  TOKEN_SCAN_POLICY_PATH:
    description: |
      Optional path to an operator token-scan policy YAML. When unset, the skill
      uses ~/.config/skillware/token_scan_policy.yaml if that file exists, otherwise
      the bundled enterprise_default profile.
    required: false
requirements:
  - requests
  - pyyaml
presentation:
  icon: shield
  color: "#0D9488"
