name: office/pdf_form_filler
version: 0.2.1
tier: core
shape: workflow
target:
  - software
tags:
  - pdf
  - form_filling
  - documents
  - acrobat
  - compliance
  - tax
description: "Deterministic AcroForm PDF inspection, curated template discovery, section-chunked schema mapping, validation, and filling engine with XFA guard, PII redaction, and radio group handling."
short_description: "Inspects, validates, and fills AcroForm PDFs using curated section-chunked templates (e.g., IRS W-8BEN) with PII redaction."
issuer:
  name: Ross Peili
  email: vpeilivanidis@gmail.com
  github: rosspeili
  org: ARPAHLS
parameters:
  type: object
  properties:
    action:
      type: string
      enum:
        - list_templates
        - get_template_schema
        - session_init
        - session_update
        - session_preview
        - session_finalize
        - inspect
        - validate
        - fill
      description: "Operation to execute: 'list_templates', 'get_template_schema', 'session_init', 'session_update', 'session_preview', 'session_finalize', 'inspect', 'validate', or 'fill'."
    template_id:
      type: string
      description: "Curated template ID (e.g., 'us_irs_w8ben'). Alternative to 'pdf_path'."
    section:
      type: string
      description: "Optional section ID for 'get_template_schema' (returns only that section's fields)."
    category:
      type: string
      description: "Optional category filter for 'list_templates' (e.g., 'tax')."
    jurisdiction:
      type: string
      description: "Optional jurisdiction filter for 'list_templates' (e.g., 'US')."
    pdf_path:
      type: string
      description: "Path to a custom AcroForm PDF form (optional when 'template_id' is provided)."
    schema_path:
      type: string
      description: "Optional path to a custom YAML schema when using an ad-hoc 'pdf_path'."
    edits:
      type: object
      description: "Mapping of semantic schema field IDs or native field names to proposed values."
    confirmed:
      type: boolean
      default: false
      description: "Safety confirmation gate. Must be true to write filled edits to output PDF."
    flatten:
      type: boolean
      default: false
      description: "Convert editable form widgets to permanent vector graphics to prevent post-fill tampering."
    output_path:
      type: string
      description: "Optional destination path for the filled PDF. Defaults to '<template_id>_<timestamp>_<filler>.pdf' or '<original>_filled.pdf'."
    output_dir:
      type: string
      description: "Optional directory for auto-named template outputs."
    filler_name:
      type: string
      description: "Optional filler/entity label used in default output filename '<template_id>_<timestamp>_<filler>.pdf'."
    auto_date:
      type: boolean
      default: true
      description: "Auto-populate schema fields with signature_mode='auto_date' to today's UTC date when omitted or 'auto'."
    check_required:
      type: boolean
      description: "Enforce required schema fields during 'validate' (defaults to true when schema is active)."
    session_id:
      type: string
      description: "Active interview session ID returned by 'session_init'."
    values:
      type: object
      description: "Field values to store in 'session_update'."
    skip_fields:
      type: array
      items:
        type: string
      description: "Field IDs to mark as 'skipped' in 'session_update'."
    defer_fields:
      description: "Field IDs (array or {field_id: note} map) to mark as 'to_revise' in 'session_update'."
    unmask:
      type: boolean
      default: false
      description: "If true, unmask sensitive PII fields in 'session_preview'."
    ttl_seconds:
      type: integer
      default: 172800
      description: "Session TTL in seconds for 'session_init' (default 48h)."
    session_dir:
      type: string
      description: "Optional override directory for file-backed session JSON files."
  required: []
outputs:
  type: object
  properties:
    status:
      type: string
      description: "Status code: 'ok', 'success', 'needs_input', 'no_change', or 'error'."
    message:
      type: string
      description: "Human-readable status summary or instruction."
    count:
      type: integer
      description: "Number of templates returned by 'list_templates'."
    templates:
      type: array
      description: "Summary list of discovered templates."
    sections_index:
      type: array
      description: "Ordered section index for 'get_template_schema'."
    fields:
      type: array
      description: "List of detected AcroForm fields or section schema fields."
    page_count:
      type: integer
      description: "Total page count of inspected PDF."
    field_count:
      type: integer
      description: "Total number of detected or validated fields."
    is_xfa:
      type: boolean
      description: "Whether the PDF uses dynamic XFA architecture."
    valid:
      type: boolean
      description: "Whether proposed edits passed validation (for action='validate')."
    errors:
      type: array
      description: "List of field mismatch reasons if validation failed."
    preview:
      type: object
      description: "Redacted review summary returned when action='fill' is invoked without confirmed=true."
    output_path:
      type: string
      description: "Path to the generated output PDF."
    filled_fields:
      type: array
      items:
        type: string
      description: "List of field identifiers successfully written to the PDF."
    flattened:
      type: boolean
      description: "Whether interactive form widgets were permanently baked/flattened."
env_vars:
  PDF_TEMPLATES_DIR:
    description: "Optional directory overriding bundled/user/project PDF form templates and YAML schemas."
    required: false
  PDF_SESSIONS_DIR:
    description: "Optional directory for file-backed interview session JSON files (default ~/.config/skillware/pdf_sessions)."
    required: false
requirements:
  - pymupdf
constitution: |
  1. USER PRIVACY & PII PROTECTION: Process PDFs strictly in-memory and on local disk; mask fields tagged sensitive: true in previews and logs; never exfiltrate document bytes or filled values.
  2. INTEGRITY: Verify field types, required schema fields, date formats, dropdown choices, and radio button export values deterministically before modifying documents.
  3. SAFETY: Enforce explicit confirmation before persisting document edits, guard against unsupported dynamic XFA forms, and never overwrite bundled blank templates.
presentation:
  icon: "document-text"
  color: "rose"
