name: office/pdf_form_filler
version: 0.2.0
description: "Deterministic AcroForm PDF inspection, validation, and filling engine with multi-action dispatch, XFA guard, and radio group handling."
short_description: "Inspects, validates, and fills AcroForm PDFs deterministically with XFA and radio group safeguards."
issuer:
  name: Ross Peili
  email: vpeilivanidis@gmail.com
  github: rosspeili
  org: ARPAHLS
parameters:
  type: object
  properties:
    action:
      type: string
      enum:
        - inspect
        - validate
        - fill
      description: "Operation to execute: 'inspect' to detect fields, 'validate' to check proposed edits, 'fill' to apply values."
    pdf_path:
      type: string
      description: "Path to the AcroForm PDF form."
    edits:
      type: object
      description: "Mapping of field_id or native field names to proposed values."
    confirmed:
      type: boolean
      default: false
      description: "Safety confirmation gate. Must be true to write filled edits to output PDF."
    flatten:
      type: boolean
      default: false
      description: "Convert editable form widgets to permanent vector graphics to prevent post-fill tampering."
    output_path:
      type: string
      description: "Optional destination path for the filled PDF. Defaults to '<original>_filled.pdf'."
    instructions:
      type: string
      description: "Legacy one-shot prompt instructions (deprecated; requires ANTHROPIC_API_KEY)."
  required:
    - pdf_path
outputs:
  type: object
  properties:
    status:
      type: string
      description: "Status code: 'ok', 'success', 'needs_input', 'no_change', or 'error'."
    message:
      type: string
      description: "Human-readable status summary or instruction."
    page_count:
      type: integer
      description: "Total page count of inspected PDF."
    field_count:
      type: integer
      description: "Total number of detected or validated fields."
    is_xfa:
      type: boolean
      description: "Whether the PDF uses dynamic XFA architecture."
    fields:
      type: array
      description: "List of detected AcroForm fields (for action='inspect')."
    valid:
      type: boolean
      description: "Whether proposed edits passed schema validation (for action='validate')."
    errors:
      type: array
      description: "List of field mismatch reasons if validation failed."
    preview:
      type: object
      description: "Review summary returned when action='fill' is invoked without confirmed=true."
    output_path:
      type: string
      description: "Absolute or relative path to the generated output PDF."
    filled_fields:
      type: array
      items:
        type: string
      description: "List of field identifiers successfully written to the PDF."
    flattened:
      type: boolean
      description: "Whether interactive form widgets were permanently baked/flattened."
requirements:
  - pymupdf
constitution: |
  1. USER PRIVACY: Process PDFs strictly in-memory and on local disk; never exfiltrate document bytes or filled values to external servers.
  2. INTEGRITY: Verify field types, dropdown choices, and radio button export values deterministically before modifying documents.
  3. SAFETY: Enforce explicit confirmation before persisting document edits and guard against unsupported dynamic XFA forms.
env_vars:
  ANTHROPIC_API_KEY:
    description: "Optional: only needed for deprecated legacy instructions prompt mode."
    required: false
presentation:
  icon: "document-text"
  color: "rose"
