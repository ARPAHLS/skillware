name: "creative/deck_builder"
version: "0.2.0"
description: "Deterministic PowerPoint (.pptx) assembly from structured deck specs."
short_description: "Assemble editable PPTX presentations from structured JSON deck specs."

issuer:
  name: "Tushar Jamunkar"
  email: "tusharjamunkar@users.noreply.github.com"
  github: "tusharjamunkar"
  org: "ARPAHLS"

category: "creative"

requirements:
  - "python-pptx>=1.0.0"
  - "pillow"

parameters:
  type: object
  properties:
    action:
      type: string
      description: "Operation to perform: validate_spec (default), render, inspect, list_templates, lint_deck, suggest_outline."
      enum:
        - validate_spec
        - render
        - inspect
        - list_templates
        - lint_deck
        - suggest_outline
      default: validate_spec

    deck_spec:
      type: object
      description: "Structured deck specification containing title, template_id, theme, metadata, and slides."

    output_path:
      type: string
      description: "Destination file path for the rendered .pptx file (required for action='render')."

    input_path:
      type: string
      description: "Path to an existing .pptx file to inspect (required for action='inspect')."

    template_id:
      type: string
      description: "Optional template identifier overriding deck_spec.template_id (e.g. pitch_v1, corporate_v1, minimal_v1)."

    theme:
      type: object
      description: "Optional theme token overrides (accent_color, font_heading, font_body)."
      properties:
        accent_color:
          type: string
          description: "Hex color code for accents (e.g. '#6E57E0')."
        font_heading:
          type: string
          description: "Font name for headings and titles (e.g. 'Calibri')."
        font_body:
          type: string
          description: "Font name for body copy and bullets (e.g. 'Calibri')."

    strict:
      type: boolean
      description: "When true, warnings are treated as validation errors (default: false)."
      default: false

    min_score:
      type: integer
      description: "Minimum quality score threshold (0-100) for action='lint_deck'."
      default: 70

    strict_a11y:
      type: boolean
      description: "Enforce strict accessibility rules (e.g. require image alt text) for action='lint_deck'."
      default: false

    archetype:
      type: string
      description: "Presentation archetype for action='suggest_outline' (investor_pitch, technical_brief, quarterly_review, product_launch, training_workshop)."
      enum:
        - investor_pitch
        - technical_brief
        - quarterly_review
        - product_launch
        - training_workshop

    topic:
      type: string
      description: "Topic or subject line used to customize the suggested outline skeleton for action='suggest_outline'."

    constraints:
      type: array
      description: "Negative constraints or topics to omit for action='suggest_outline' (e.g. ['no pricing', 'no financial'])."
      items:
        type: string
  required: []

outputs:
  success:
    type: boolean
    description: "True when the requested action completed without errors."

  action:
    type: string
    description: "Echo of the executed action."

  valid:
    type: boolean
    description: "True when deck_spec passed schema and business rule validation."

  template_id:
    type: string
    description: "Identifier of the template used or validated."

  slide_count:
    type: integer
    description: "Total number of slides validated, rendered, or inspected."

  output_path:
    type: string
    description: "Target path where the presentation was saved (for render action)."

  file_size_bytes:
    type: integer
    description: "File size in bytes of the generated .pptx file."

  slides:
    type: array
    description: "Summary list of slides processed or inspected."
    items:
      type: object

  warnings:
    type: array
    description: "Non-fatal warnings (e.g. character truncation, fallback layouts)."
    items:
      type: object
      properties:
        code:
          type: string
        slide_index:
          type: integer
        message:
          type: string

  errors:
    type: array
    description: "Fatal validation errors preventing rendering."
    items:
      type: object
      properties:
        code:
          type: string
        slide_index:
          type: integer
        message:
          type: string

  error_code:
    type: string
    description: "Top-level error classification code when action fails."

  templates:
    type: array
    description: "List of bundled templates and metadata (for list_templates action)."
    items:
      type: object

  score:
    type: integer
    description: "Calculated presentation quality score (0-100) for action='lint_deck'."

  passed:
    type: boolean
    description: "True when quality score meets or exceeds min_score for action='lint_deck'."

  findings:
    type: array
    description: "List of heuristic rule findings and improvement suggestions for action='lint_deck'."
    items:
      type: object

  issues:
    type: array
    description: "Alias for findings for action='lint_deck'."
    items:
      type: object

  archetype:
    type: string
    description: "Archetype identifier used for action='suggest_outline'."

  name:
    type: string
    description: "Display name of the suggested archetype outline."

  description:
    type: string
    description: "Summary description of the archetype narrative structure."

  recommended_slide_count:
    type: integer
    description: "Recommended number of slides in the suggested outline."

  constraints_applied:
    type: array
    description: "List of negative constraints applied during outline suggestion."
    items:
      type: string

  deck_spec:
    type: object
    description: "Generated skeleton deck_spec for action='suggest_outline'."

  deck_spec_skeleton:
    type: object
    description: "Alias for deck_spec skeleton for action='suggest_outline'."

constitution:
  LOCAL_ASSEMBLY: "Never call network APIs or external LLMs from execute()."
  DETERMINISTIC: "Same valid deck_spec + template produces reproducible slide structure and text content."
  EDITABLE_OUTPUT: "Produce standard .pptx editable in PowerPoint/LibreOffice; do not rasterize whole slides."
  FAIL_CLOSED: "Validate before render; reject unsafe paths and invalid assets."
  PRIVACY: "Do not persist deck content beyond the caller's output_path."