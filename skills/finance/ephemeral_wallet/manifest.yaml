name: finance/ephemeral_wallet
version: 0.2.0
tier: core
shape: workflow
target:
  - software
tags:
  - payments
  - x402
  - agent-wallet
  - web3
  - finance
description: |
  Spend-capped, short-lived agent payment sessions for x402 v2 HTTP micropayments
  using a dedicated CDP-style wallet. create_session / status / quote / pay / revoke
  with 402 handshake, EIP-3009 live signing via CDP_WALLET_SECRET, SSRF guards,
  CAIP-2 networks, and idempotency. Mock HTTP in CI.
short_description: "x402 v2 sessions with quote, EIP-3009 live sign, SSRF + CAIP-2."
category: finance
issuer:
  name: Hendobox
  email: henryonyebuchi53@gmail.com
  github: Hendobox
  org: ARPAHLS
parameters:
  type: object
  properties:
    action:
      type: string
      description: "Session action to run."
      enum:
        - create_session
        - status
        - quote
        - pay
        - revoke
    spend_cap_usd:
      type: number
      description: "Soft session spend cap in USD (create_session). Default from config / 5.0."
    ttl_seconds:
      type: integer
      description: "Soft session TTL in seconds (create_session). Default 7200."
    network:
      type: string
      description: >
        Settlement network alias or CAIP-2 (create_session). Default base-sepolia
        → eip155:84532.
    allowed_domains:
      type: array
      description: "Optional hostname allowlist for pay URLs (create_session)."
      items:
        type: string
    session_id:
      type: string
      description: "Host-held session id from create_session (status / pay / revoke)."
    url:
      type: string
      description: "Resource URL for x402 quote/pay (SSRF-checked)."
    amount_usd:
      type: number
      description: >
        Optional max USD for this pay. Server atomic amount (from PAYMENT-REQUIRED)
        is verified against remaining_usd and this cap before signing.
    idempotency_key:
      type: string
      description: "Optional key; replay returns the prior confirmed payment."
    live:
      type: boolean
      description: >
        Request live HTTP x402 + EIP-3009 signing. Requires CDP_* env
        (CDP_WALLET_SECRET is the dedicated agent hex key). Default mock.
  required:
    - action
outputs:
  status:
    type: string
    description: >
      ready | confirmed | revoked | expired | missing_config | over_cap |
      error (and related fail-closed codes).
  session_id:
    type: string
    description: "Opaque session id for later turns."
  remaining_usd:
    type: number
    description: "Soft remaining spend counter (display, not a hard bound in v0.1)."
  payment:
    type: object
    description: "Receipt refs from pay (url, amount_usd, tx_ref, receipt_ref)."
constitution: |
  1. DEDICATED AGENT WALLET ONLY: Never use personal, treasury, or exchange keys.
  2. NO SECRETS IN OUTPUT: Never return private keys, seeds, CDP secrets, or
     full PANs/CVVs. Redact; teach agents not to echo secrets.
  3. FAIL CLOSED: Missing live config, unknown/expired/revoked session,
     over-cap, SSRF, or replay must abort pay — do not guess.
  4. SOFT POLICY: spend_cap_usd, TTL, and revoke are in-process UX policy.
     Fund the dedicated session wallet to the cap for a real bound; do not
     claim a cryptographic hard limit from the counter alone.
  5. SSRF / ALLOWLIST: Block private, loopback, and metadata URLs; honor
     allowed_domains when set.
  6. NOT FINANCIAL ADVICE: Settlements are technical operations; on-chain
     results may differ from quotes.
  7. BOUNDARY: This skill only does spend-capped x402 session pay.
     General swaps/transfers belong in defi/evm_tx_handler.
env_vars:
  CDP_API_KEY_ID:
    description: "CDP API key id for live pay (later slice). Not required for mock v0.1."
    required: false
  CDP_API_KEY_SECRET:
    description: "CDP API key secret for live pay (later slice). Never pass in tool args."
    required: false
  CDP_WALLET_SECRET:
    description: >
      Dedicated agent wallet hex private key for live EIP-3009 signing
      (never tool args). Required when live=true.
    required: false
  EPHEMERAL_WALLET_NETWORK:
    description: "Default network label (e.g. base-sepolia). Optional."
    required: false
  EPHEMERAL_WALLET_FACILITATOR_URL:
    description: "Optional x402 facilitator URL override."
    required: false
  EPHEMERAL_WALLET_SESSION_DIR:
    description: >
      Optional directory for append-only sessions.jsonl / payments.jsonl.
      If set, must be writable (fail closed — no silent memory-only fallback).
    required: false
  EPHEMERAL_WALLET_MOCK:
    description: "Set to 0 to request live HTTP mode (requires CDP_*)."
    required: false
requirements:
  - requests
  - eth_account
presentation:
  icon: "credit-card"
  color: "#2D9CDB"
