name: finance/uk_companies_house_handler
version: 1.3.0
description: |
  Deterministic UK Companies House API handler for agents. Provides structured
  operations for company search, profile lookup, officer and PSC listing with
  deterministic role/name filters, filing history with helpers, and turn-by-turn
  pipeline orchestration. Returns status-based responses (ready, partial,
  needs_input, error) with disambiguation support. The agent owns natural-language
  dialogue; the skill returns structured candidates and records.
short_description: "Use for UK Companies House lookups: company search, officers, PSC, and filings (structured actions)."
issuer:
  name: Areen Agrawal
  email: agrawalareen09@gmail.com
  github: Areen-09
  org: ARPAHLS
parameters:
  type: object
  properties:
    action:
      type: string
      description: >
        The operation to perform. One of: resolve_company, get_company_profile,
        get_officers, get_pscs, get_filing_history, run_pipeline,
        resolve_and_get_officers, resolve_and_get_filings, resolve_company_officer.
      enum:
        - resolve_company
        - get_company_profile
        - get_officers
        - get_pscs
        - get_filing_history
        - run_pipeline
        - resolve_and_get_officers
        - resolve_and_get_filings
        - resolve_company_officer
    query:
      type: string
      description: "Company name or partial name for search (resolve_company)."
    company_query:
      type: string
      description: "Company name query for composite actions (resolve_and_get_officers, resolve_and_get_filings, resolve_company_officer)."
    company_number:
      type: string
      description: "8-character UK company number (required for profile/officers/pscs/filing)."
    active_only:
      type: boolean
      description: "Filter to current/active records only. Default true for get_officers and get_pscs."
    limit:
      type: integer
      description: "Max results to return. Default 5 for resolve_company, 10 for officers and filings."
    start_index:
      type: integer
      description: "Offset index for paginated queries (default 0)."
    category:
      type: string
      description: "Filing category filter (get_filing_history, resolve_and_get_filings)."
    latest_only:
      type: boolean
      description: "Filter filing history to return only the single most recent filing."
    latest_per_category:
      type: boolean
      description: "Filter filing history to return the latest filing for each distinct category."
    officer_name:
      type: string
      description: "Officer name filter for get_officers, resolve_and_get_officers, or resolve_company_officer."
    officer_role:
      type: string
      description: "Filter officers by canonical category (director, secretary, corporate) or exact Companies House statutory role."
    role_hint:
      type: string
      description: "Requested role or title hint (e.g. 'ceo', 'cfo', 'chairman') for officers lookup and UK terminology note."
    steps:
      type: array
      description: "Ordered list of step objects with action and params to execute sequentially (run_pipeline). For multi-intent queries, construct steps directly with resolve_company first and '<from_resolve>' in subsequent steps."
      items:
        type: object
        properties:
          action:
            type: string
          params:
            type: object
            description: "Step-specific parameters (e.g. query, company_number, role_hint, officer_name, officer_role, active_only, category, latest_only, latest_per_category, limit, start_index)."
        required:
          - action
    stop_on:
      type: array
      description: "List of status strings on which run_pipeline should pause/halt execution. Default: ['needs_input', 'error']."
      items:
        type: string
    context:
      type: object
      description: "State carried over from prior skill turns (e.g. company_number, company_name)."
    pipeline:
      type: object
      description: "State of an executing Single-step pipeline (e.g. completed_steps, total_steps) to carry forward."
  required:
    - action
outputs:
  status:
    type: string
    description: "Envelope status: ready, partial, needs_input, or error. Status partial is reserved for in-flight run_pipeline execution."
  source:
    type: string
    description: "Data provenance (typically companies_house_api)."
  fetched_at:
    type: string
    description: "UTC ISO timestamp when the response was built."
  context:
    type: object
    description: "Session state to pass on the next call (company_number, company_name, last_action, selected_transaction_id)."
  pipeline:
    type: object
    description: "Single-step progress when using run_pipeline."
  agent_hint:
    type: string
    description: "Optional guidance for the host agent (disambiguation, partial previews, retries)."
  company_number:
    type: string
    description: "Resolved 8-character company number when applicable."
  company_name:
    type: string
    description: "Registered company name when applicable."
  officers:
    type: array
    description: "Officer records from get_officers or composite actions."
  filings:
    type: array
    description: "Filing records from get_filing_history or composite actions."
  steps:
    type: array
    description: "Remaining steps to execute when run_pipeline returns status partial."
constitution: |
  1. Use only publicly available Companies House data.
  2. Require COMPANIES_HOUSE_API_KEY via environment; never hardcode or log the key.
  3. Do not cache personal data (officer names, addresses) beyond the current request.
  4. Always cite company_number and data timestamp (fetched_at) in responses.
  5. Never guess a company number; return ranked search hits when ambiguous.
  6. This skill provides company information, not legal or accounting advice.
  7. Do not submit filings or modify Companies House records.
env_vars:
  COMPANIES_HOUSE_API_KEY:
    description: "API key from the Companies House Developer Hub. Used as HTTP Basic username with empty password."
    required: true
requirements:
  - requests
