name: finance/uk_companies_house_handler
version: 1.4.0
description: |
  Deterministic UK Companies House API handler for agents. Provides structured
  operations for company search, profile lookup, officer and PSC listing with
  deterministic role/name filters, filing history with helpers, Document API
  discover/pick/download flow (list_downloadable_documents, get_document_metadata,
  fetch_document), and turn-by-turn pipeline orchestration. Returns status-based
  responses (ready, partial, needs_input, error) with disambiguation support. The
  agent owns natural-language dialogue; the skill returns structured candidates
  and records. Downloaded document bytes are returned in-memory as bounded base64
  and are never persisted to disk.
short_description: "UK Companies House search, officers, PSC, filings, Document API download, and pipeline orchestration via structured actions."
issuer:
  name: Areen Agrawal
  email: agrawalareen09@gmail.com
  github: Areen-09
  org: ARPAHLS
parameters:
  type: object
  properties:
    action:
      type: string
      description: >
        The operation to perform. One of: resolve_company, get_company_profile,
        get_officers, get_pscs, get_filing_history, list_downloadable_documents,
        get_document_metadata, fetch_document, run_pipeline,
        resolve_and_get_officers, resolve_and_get_filings, resolve_company_officer.
      enum:
        - resolve_company
        - get_company_profile
        - get_officers
        - get_pscs
        - get_filing_history
        - list_downloadable_documents
        - get_document_metadata
        - fetch_document
        - run_pipeline
        - resolve_and_get_officers
        - resolve_and_get_filings
        - resolve_company_officer
    query:
      type: string
      description: "Company name or partial name for search (resolve_company)."
    company_query:
      type: string
      description: "Company name query for composite actions (resolve_and_get_officers, resolve_and_get_filings, resolve_company_officer)."
    company_number:
      type: string
      description: "8-character UK company number (required for profile/officers/pscs/filing/list_downloadable_documents)."
    active_only:
      type: boolean
      description: "Filter to current/active records only. Default true for get_officers and get_pscs."
    limit:
      type: integer
      description: "Max results to return. Default 5 for resolve_company, 10 for officers/filings/documents (documents max 25)."
    start_index:
      type: integer
      description: "Offset index for paginated queries (default 0)."
    category:
      type: string
      description: "Filing category filter (get_filing_history, resolve_and_get_filings, list_downloadable_documents)."
    latest_only:
      type: boolean
      description: "Return only the single most recent filing or downloadable document."
    latest_per_category:
      type: boolean
      description: "Return the latest filing or downloadable document for each distinct category."
    officer_name:
      type: string
      description: "Officer name filter for get_officers, resolve_and_get_officers, or resolve_company_officer."
    officer_role:
      type: string
      description: "Filter officers by canonical category (director, secretary, corporate) or exact Companies House statutory role."
    role_hint:
      type: string
      description: "Requested role or title hint (e.g. 'ceo', 'cfo', 'chairman') for officers lookup and UK terminology note."
    transaction_id:
      type: string
      description: "Filing/document transaction id for get_document_metadata or fetch_document."
    metadata_url:
      type: string
      description: "Document API metadata URL from filing links.document_metadata (get_document_metadata, fetch_document)."
    content_type:
      type: string
      description: "Desired MIME type for fetch_document (default application/pdf)."
    include_content:
      type: boolean
      description: "When false, fetch_document returns metadata and download_url without base64 bytes (default true)."
    max_bytes:
      type: integer
      description: "Maximum document payload size in bytes for fetch_document (default 5242880 / 5 MB, hard ceiling 10485760 / 10 MB)."
    steps:
      type: array
      description: "Ordered list of step objects with action and params to execute sequentially (run_pipeline). For multi-intent queries, construct steps directly with resolve_company first and '<from_resolve>' in subsequent steps. Document steps: list_downloadable_documents, fetch_document."
      items:
        type: object
        properties:
          action:
            type: string
          params:
            type: object
            description: "Step-specific parameters (e.g. query, company_number, role_hint, officer_name, officer_role, active_only, category, latest_only, latest_per_category, limit, start_index, transaction_id, metadata_url, content_type, include_content, max_bytes)."
        required:
          - action
    stop_on:
      type: array
      description: "List of status strings on which run_pipeline should pause/halt execution. Default: ['needs_input', 'error']."
      items:
        type: string
    context:
      type: object
      description: "State carried over from prior skill turns (e.g. company_number, company_name, selected_transaction_id, document_candidates)."
    pipeline:
      type: object
      description: "State of an executing Single-step pipeline (e.g. completed_steps, total_steps) to carry forward."
  required:
    - action
outputs:
  status:
    type: string
    description: "Envelope status: ready, partial, needs_input, or error. Status partial is reserved for in-flight run_pipeline execution."
  source:
    type: string
    description: "Data provenance (companies_house_api or companies_house_document_api)."
  fetched_at:
    type: string
    description: "UTC ISO timestamp when the response was built."
  context:
    type: object
    description: "Session state to pass on the next call (company_number, company_name, last_action, selected_transaction_id, document_candidates)."
  pipeline:
    type: object
    description: "Single-step progress when using run_pipeline."
  agent_hint:
    type: string
    description: "Optional guidance for the host agent (disambiguation, partial previews, retries, Retry-After)."
  company_number:
    type: string
    description: "Resolved 8-character company number when applicable."
  company_name:
    type: string
    description: "Registered company name when applicable."
  officers:
    type: array
    description: "Officer records from get_officers or composite actions."
  filings:
    type: array
    description: "Filing records from get_filing_history or composite actions."
  documents:
    type: array
    description: "Downloadable document candidates from list_downloadable_documents."
  content_base64:
    type: string
    description: "Base64-encoded document bytes from fetch_document when include_content is true."
  steps:
    type: array
    description: "Remaining steps to execute when run_pipeline returns status partial."
constitution: |
  1. Use only publicly available Companies House data.
  2. Require COMPANIES_HOUSE_API_KEY via environment; never hardcode or log the key.
  3. Do not cache personal data (officer names, addresses) beyond the current request.
  4. Always cite company_number and data timestamp (fetched_at) in responses.
  5. Never guess a company number; return ranked search hits when ambiguous.
  6. This skill provides company information, not legal or accounting advice.
  7. Do not submit filings or modify Companies House records.
  8. Downloaded document bytes must be delivered directly in response envelopes;
     never persist PDFs, metadata caches, or corporate records to local filesystem disks.
  9. When following Document API redirects to external storage, drop Authorization
     headers so pre-signed URLs are not rejected.
  10. On HTTP 429, return a structured error with Retry-After in agent_hint; do not
      sleep or client-throttle inside the skill.
env_vars:
  COMPANIES_HOUSE_API_KEY:
    description: "API key from the Companies House Developer Hub. Used as HTTP Basic username with empty password for both the Public Data API and Document API."
    required: true
requirements:
  - requests
