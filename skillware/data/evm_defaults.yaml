# Bundled EVM chain defaults for Skillware (skillware evm init copies to user config).
# RPC secrets stay in .env — only rpc_env names are stored here.

version: 1

chains:
  ethereum:
    enabled: true
    chain_id: 1
    rpc_env: ETHEREUM_RPC_URL
    native_symbol: eth
    native_decimals: 18
    explorer_tx_url: "https://etherscan.io/tx/{tx_hash}"
    router_v2: "0x7a250d5630B4cF539739dF2C5dA4bF9C15291ECE"
    weth: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
    multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"

  base:
    enabled: true
    chain_id: 8453
    rpc_env: BASE_RPC_URL
    native_symbol: eth
    native_decimals: 18
    explorer_tx_url: "https://basescan.org/tx/{tx_hash}"
    router_v2: "0x4752ba5DBC23f44d87826276bf6fd6b1c372aD24"
    weth: "0x4200000000000000000000000000000000000006"
    multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"

  anvil_local:
    enabled: false
    chain_id: 31337
    rpc_url: "http://127.0.0.1:8545"
    native_symbol: eth
    native_decimals: 18

tokens:
  base:
    degen:
      address: "0x4ed4E862860beD51a9570b96d89aF5E1B0Efefed"
      decimals: 18
  ethereum:
    usdc:
      address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606EB48"
      decimals: 6
